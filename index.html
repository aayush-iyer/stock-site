<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Site</title>

    <!-- Fonts: Cormorant Garamond (headings), Fraunces (numbers), Lato (text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Fraunces:opsz,wght@9..144,400&family=Lato:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <p class="label">Hello,</p>
      <h1 class="greeting">Aayush</h1>

      <section class="card">
        <p class="label">Practice portfolio</p>
        <p class="big-number">$104,250<span class="cents">.80</span></p>
        <span class="chip">+2.4% today</span>
      </section>
    </main>
  </body>
</html>
